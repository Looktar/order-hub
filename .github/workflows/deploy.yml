# 每次推送到 main：先跑权限测试，通过后部署数据库、接口和网页
name: 测试并部署

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: 权限与通知测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: 运行测试
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          tests/run_local.sh 2>&1 | tee test.log
          grep -q ALL_TESTS_PASSED test.log

  backend:
    name: 部署数据库和接口
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'webbqhvgmsxjxgkfxxhp' }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查设置
        env:
          AS_VARIABLE: ${{ vars.SUPABASE_ACCESS_TOKEN != '' }}
          OTHER_NAME: ${{ secrets.SUPABASE_TOKEN != '' || secrets.ACCESS_TOKEN != '' || secrets.SUPABASE_ACCESS_TOKEN_ != '' }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            case "$SUPABASE_ACCESS_TOKEN" in sbp_*) echo "令牌已找到，格式正确";; *) echo "::warning::令牌已找到，但不是以 sbp_ 开头，可能复制错了";; esac
            exit 0
          fi
          if [ "$AS_VARIABLE" = "true" ]; then
            echo "::error::令牌被填在了 Variables 标签页。请删掉它，改到 Secrets 标签页里重新添加。"
          elif [ "$OTHER_NAME" = "true" ]; then
            echo "::error::Secret 的名字不对，必须是 SUPABASE_ACCESS_TOKEN。"
          else
            echo "::error::仓库的 Actions Secrets 里找不到 SUPABASE_ACCESS_TOKEN（可能填到了 Environments、Codespaces 或 Dependabot 下面，或者名字有误）。"
          fi
          exit 1
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 更新数据库
        run: scripts/apply_migrations.sh
      - name: 部署接口
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
      - name: 关闭自助注册（账号只能由管理员开通）
        run: |
          curl -sf -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"disable_signup": true}' > /dev/null

  web:
    name: 部署网页
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'webbqhvgmsxjxgkfxxhp' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 生成网页配置
        run: |
          ANON=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json \
                 | jq -r '[.[] | select(.name=="anon" or .type=="publishable")][0].api_key')
          if [ -z "$ANON" ] || [ "$ANON" = "null" ]; then echo "::error::读取不到前端公开钥匙"; exit 1; fi
          cat > web/config.js <<EOF
          window.ORDER_HUB_CONFIG = {
            supabaseUrl: "https://${PROJECT_REF}.supabase.co",
            supabaseAnonKey: "${ANON}",
            loginDomain: "users.order-hub.app",
          };
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  smoke:
    name: 线上检查
    needs: web
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'webbqhvgmsxjxgkfxxhp' }}
    steps:
      - name: 网页、接口和权限
        run: |
          site="https://looktar.github.io/order-hub/"
          for i in $(seq 1 12); do [ "$(curl -s -o /dev/null -w '%{http_code}' "$site")" = "200" ] && break; sleep 10; done
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$site")" = "200" ] && echo "通过：网页能打开"
          key=$(curl -sf "${site}config.js" | grep -o 'supabaseAnonKey: "[^"]*"' | cut -d'"' -f2)
          [ -n "$key" ] && echo "通过：网页配置已生成"
          api="https://$PROJECT_REF.supabase.co/functions/v1/api"
          curl -sf "$api" | grep -q "订单协作系统" && echo "通过：Agent 接口在线"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$api/orders" -H 'Authorization: Bearer oh_invalid')" = "401" ] && echo "通过：错误令牌被拒绝"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$PROJECT_REF.supabase.co/rest/v1/orders" -H "apikey: $key")
          [ "$code" != "200" ] && echo "通过：未登录读不到订单（$code）"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/auth/v1/signup" -H "apikey: $key" -H "Content-Type: application/json" -d '{"email":"probe-'$RANDOM'@example.com","password":"probe-pass-123456"}')
          [ "$code" != "200" ] && echo "通过：自助注册已关闭（$code）"
