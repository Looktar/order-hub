# 每次推送到 main：先跑权限测试，通过后部署数据库、接口和网页
name: 测试并部署

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: 权限与通知测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: 运行测试
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          tests/run_local.sh 2>&1 | tee test.log
          grep -q ALL_TESTS_PASSED test.log

  backend:
    name: 部署数据库和接口
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'webbqhvgmsxjxgkfxxhp' }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查设置
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::还没有填写 Secret：SUPABASE_ACCESS_TOKEN。请按 docs/部署设置.md 操作。"; exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 更新数据库
        run: scripts/apply_migrations.sh
      - name: 部署接口
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: 关闭自助注册（账号只能由管理员开通）
        run: |
          curl -sf -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"disable_signup": true}' > /dev/null

  web:
    name: 部署网页
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'webbqhvgmsxjxgkfxxhp' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 生成网页配置
        run: |
          ANON=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json \
                 | jq -r '[.[] | select(.name=="anon" or .type=="publishable")][0].api_key')
          if [ -z "$ANON" ] || [ "$ANON" = "null" ]; then echo "::error::读取不到前端公开钥匙"; exit 1; fi
          cat > web/config.js <<EOF
          window.ORDER_HUB_CONFIG = {
            supabaseUrl: "https://${PROJECT_REF}.supabase.co",
            supabaseAnonKey: "${ANON}",
            loginDomain: "users.order-hub.app",
          };
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
